name: Generate contribution snake

# Renders the contribution graph as animated SVGs (light + dark) and commits
# them to `main` so the profile README can hotlink them from raw.githubusercontent.
on:
  schedule:
    # Shortest interval GitHub cron allows, off the hour to avoid the rush.
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

# Never run two renders at once, or they race on the same files.
concurrency:
  group: snake
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Render snake SVGs
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: dist/snake.svg dist/snake-dark.svg

      - name: Commit rendered SVGs
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f dist/snake.svg dist/snake-dark.svg
          if git diff --cached --quiet; then
            echo "snake unchanged; nothing to commit"
            exit 0
          fi
          git commit -m "chore: refresh contribution snake [skip ci]"
          git push origin HEAD:main
